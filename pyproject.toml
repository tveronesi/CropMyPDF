[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cropmypdf"
version = "0.2.0"
description = "Crop PDF margins for e-readers: GUI, CLI and an embedded AI agent skill."
authors = [
    { name = "A Bianchi" }
]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "Pillow",
    "PyMuPDF"
]

[project.scripts]
cropmypdf = "cropmypdf.cli:main"

[tool.setuptools]
packages = ["cropmypdf"]

[tool.setuptools.package-data]
cropmypdf = ["skill/*.md"]
